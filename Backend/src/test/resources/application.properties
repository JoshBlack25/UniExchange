spring.application.name=UniExchange

# In-memory H2 so the test suite runs with no MySQL server and no network.
spring.datasource.url=jdbc:h2:mem:uniexchange;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=test-secret-that-is-definitely-long-enough-for-hs256
app.jwt.ttl-seconds=3600
app.cors.allowed-origins=http://localhost:5173
