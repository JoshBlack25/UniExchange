spring.application.name=UniExchange

# In-memory H2 so the test suite runs with no MySQL server and no network.
# LOCK_TIMEOUT is raised from H2's ~1 second default because the wallet
# concurrency test deliberately contends on one row with SELECT ... FOR UPDATE.
# At the default the losing thread times out instead of waiting its turn, and the
# test fails for the wrong reason - intermittently, which is worse.
spring.datasource.url=jdbc:h2:mem:uniexchange;DB_CLOSE_DELAY=-1;MODE=MySQL;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root
# Throwaway: H2 in-memory accepts any password. Never a real one here.
spring.datasource.password=test-only-not-a-secret

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=test-secret-that-is-definitely-long-enough-for-hs256
app.jwt.ttl-seconds=3600
# ---- CORS (comma separated) ----
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ---- File uploads (listing images) ----
# Uploaded listing images are kept outside the database. Change this to a
# persistent volume path in production.
app.listing-images.upload-dir=${LISTING_IMAGES_DIR:uploads/listing-images}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- File uploads (general) ----
# Where UploadController saves images and WebConfig serves them back from,
# relative to the working directory the app is started in. Gitignored - each
# environment accumulates its own files here.
app.uploads.dir=uploads

# ---- Chat attachments ----
# Under target/ so a test run never leaves files in the project root and a clean
# build wipes them.
app.chat.media.dir=target/test-chat-media
app.media.link-secret=test-media-link-secret-at-least-32-bytes-long


# spring.mail.host is deliberately NOT set here, so tests use LoggingEmailSender
# instead of hitting real Gmail SMTP. For real SMTP locally, put credentials in
# the untracked src/test/resources/application-local.properties instead - see
# src/main/resources/application.properties for the format.
app.otp.from=no-reply@uniexchange.local

# MockMvc sends every request from 127.0.0.1, so per-IP limits would trip across
# unrelated tests. RateLimitFilterTest exercises the limiter directly.
app.rate-limit.enabled=false