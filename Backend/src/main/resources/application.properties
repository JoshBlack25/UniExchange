spring.application.name=UniExchange

# Loads src/main/resources/application-local.properties when it exists, and is
# silently ignored when it does not - so each developer can keep their own DB
# password there instead of in this committed file. That file is gitignored.
spring.profiles.active=local

# ---- Datasource (MySQL for development) ----
# NEVER put a real password in this file - it is committed to git and shared
# with the whole team. Set DB_PASSWORD in your environment instead, or create
# an untracked src/main/resources/application-local.properties and run with
# the "local" profile. See the README, "Configure your database password".
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:uniexchange}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# driver-class-name is inferred from the URL - no need to set it.

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Close the EntityManager at the end of the service call, not the view render.
spring.jpa.open-in-view=false
# Do NOT set hibernate.dialect: Hibernate 7 auto-detects from the connection, and
# MySQL8Dialect no longer exists (only org.hibernate.dialect.MySQLDialect).

# ---- JWT ----
# Must be at least 32 bytes or Keys.hmacShaKeyFor throws WeakKeyException at startup.
app.jwt.secret=${JWT_SECRET:change-me-to-at-least-32-bytes-of-random-secret-value}
app.jwt.ttl-seconds=3600
# How long a "Remember me" sign-in lasts. 30 days. There is no refresh endpoint,
# so without a longer lifetime here the checkbox would still sign a student out
# every hour. The trade: a JWT cannot be revoked, so a stolen remembered token is
# good until it expires. Shorten this if that is not acceptable.
app.jwt.remembered-ttl-seconds=2592000

# ---- Trusted devices ("Remember me") ----
# How long a browser may skip the emailed code after proving itself once.
# remembered-days is the ticked case and slides forward on every use;
# session-hours is the unticked case and is a hard cap - the browser also keeps
# that token in sessionStorage, so closing the browser loses it either way.
app.trusted-device.remembered-days=30
app.trusted-device.session-hours=12

# ---- Student email rule ----
# The signup gate. Overridable so a legitimate student number of a different
# length never needs a code change - just a property change.
app.auth.student-email-pattern=^\\d{8,10}@mycput\\.ac\\.za$

# ---- Email OTP verification ----
app.otp.length=6
app.otp.ttl-minutes=10
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60
app.otp.from=no-reply@uniexchange.local

# ---- SMTP ----
# spring.mail.host is deliberately NOT set here. Without it the app logs every
# OTP to the console instead of sending it, so teammates and CI need no mail
# credentials at all. That is the normal way to run this project.
#
# To send real email, DO NOT add credentials to this file - it is committed.
# Put them in the untracked application-local.properties instead:
#
#   spring.mail.host=smtp.gmail.com
#   spring.mail.port=587
#   spring.mail.username=you@gmail.com
#   spring.mail.password=xxxx xxxx xxxx xxxx     # 16-char Gmail App Password
#   spring.mail.properties.mail.smtp.auth=true
#   spring.mail.properties.mail.smtp.starttls.enable=true
#   app.otp.from=you@gmail.com
#
# The App Password is created at myaccount.google.com/apppasswords and needs
# 2-Step Verification switched on first. It is not your Google login password.
# See the README, "Email / OTP Delivery".

# ---- CORS (comma separated) ----
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
