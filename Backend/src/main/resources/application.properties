spring.application.name=UniExchange

# Loads src/main/resources/application-local.properties when it exists, and is
# silently ignored when it does not - so each developer can keep their own DB
# password there instead of in this committed file. That file is gitignored.
#
# "local" is only the DEFAULT. A deployment sets SPRING_PROFILES_ACTIVE=prod
# (Azure App Settings), which replaces it entirely, so production can never
# silently pick up a developer's local profile.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ---- Datasource (MySQL for development) ----
# NEVER put a real password in this file - it is committed to git and shared
# with the whole team. Set DB_PASSWORD in your environment instead, or create
# an untracked src/main/resources/application-local.properties and run with
# the "local" profile. See the README, "Configure your database password".
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:uniexchange}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# driver-class-name is inferred from the URL - no need to set it.

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
# Off by default: SQL logging leaks data into logs and costs throughput.
# Turn it on in your own application-local.properties when debugging.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Close the EntityManager at the end of the service call, not the view render.
spring.jpa.open-in-view=false
# Do NOT set hibernate.dialect: Hibernate 7 auto-detects from the connection, and
# MySQL8Dialect no longer exists (only org.hibernate.dialect.MySQLDialect).

# ---- JWT ----
# Must be at least 32 bytes or Keys.hmacShaKeyFor throws WeakKeyException at startup.
# There is deliberately no default: anyone who knows the secret can sign their own
# (admin) tokens. Set JWT_SECRET, or app.jwt.secret in application-local.properties.
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-seconds=3600
# How long a "Remember me" sign-in lasts. 7 days. There is no refresh endpoint,
# so without a longer lifetime here the checkbox would still sign a student out
# every hour. The trade: a JWT cannot be revoked, so a stolen remembered token is
# good until it expires - which is why this is a week, not a month.
app.jwt.remembered-ttl-seconds=604800

# ---- Trusted devices ("Remember me") ----
# How long a browser may skip the emailed code after proving itself once.
# remembered-days is the ticked case and slides forward on every use;
# session-hours is the unticked case and is a hard cap - the browser also keeps
# that token in sessionStorage, so closing the browser loses it either way.
app.trusted-device.remembered-days=30
app.trusted-device.session-hours=12

# ---- Student email rule ----
# The signup gate. Overridable so a legitimate student number of a different
# length never needs a code change - just a property change.
app.auth.student-email-pattern=^\\d{8,10}@mycput\\.ac\\.za$
# CPUT staff sign up with their @cput.ac.za address. They get the FACULTY role
# and a "CPUT Staff" badge, with the same features as a student.
app.auth.staff-email-pattern=^[A-Za-z0-9._%+-]+@cput\\.ac\\.za$

# ---- Moderation ----
# Accounts granted a role at startup (comma separated). The account must already
# exist; if it registers later, the role is granted when it verifies its email.
app.bootstrap.admins=240453182@mycput.ac.za
app.bootstrap.moderators=
# Reviews at or below this star rating alert every moderator.
app.moderation.bad-review-threshold=2
# How long a session opened through the moderator/admin sign-in lasts.
app.jwt.elevated-ttl-seconds=3600

# ---- Email OTP verification ----
app.otp.length=6
app.otp.ttl-minutes=10
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60
# Codes emailed to one account per rolling day. Protects the Gmail sending quota
# and a student's inbox; the per-IP rate limits alone cannot, since an attacker
# can rotate addresses.
app.otp.max-per-day=10
app.otp.from=no-reply@uniexchange.local

# ---- SMTP ----
# spring.mail.host is deliberately NOT set here. Without it the app logs every
# OTP to the console instead of sending it, so teammates and CI need no mail
# credentials at all. That is the normal way to run this project.
#
# To send real email, DO NOT add credentials to this file - it is committed.
# Put them in the untracked application-local.properties instead:
#
#   spring.mail.host=smtp.gmail.com
#   spring.mail.port=587
#   spring.mail.username=you@gmail.com
#   spring.mail.password=xxxx xxxx xxxx xxxx     # 16-char Gmail App Password
#   spring.mail.properties.mail.smtp.auth=true
#   spring.mail.properties.mail.smtp.starttls.enable=true
#   app.otp.from=you@gmail.com
#
# The App Password is created at myaccount.google.com/apppasswords and needs
# 2-Step Verification switched on first. It is not your Google login password.
# See the README, "Email / OTP Delivery".

# ---- CORS (comma separated) ----
# Set CORS_ALLOWED_ORIGINS to the deployed frontend origin(s). Never "*".
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---- File uploads ----
# Where UploadController saves images and WebConfig serves them back from,
# relative to the working directory the app is started in. Gitignored - each
# environment accumulates its own files here.
app.uploads.dir=uploads
# Per image, and per student per rolling day (the same pattern as chat media).
app.uploads.max-bytes=10485760
app.uploads.daily-quota-bytes=104857600

# 25MB so a short phone video can be sent in chat. NOTE this limit is GLOBAL -
# it also applies to listing images, so per-endpoint caps are enforced in code
# (ChatMediaStorage/ChatServiceImpl for chat, UploadController for images)
# rather than relying on this number alone.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# When Tomcat rejects an oversized upload it aborts the connection unless it is
# allowed to read (swallow) the rest of the body first. Without this the browser
# sees a bare network error instead of the 413 JSON that GlobalExceptionHandler
# produces, and the student is told nothing useful. Capped at 2MB rather than -1
# (unlimited) so a client cannot make Tomcat read an arbitrarily large body just
# to reject it; bodies just over the multipart limit still get the 413 JSON.
server.tomcat.max-swallow-size=2MB

# ---- Chat attachments ----
# Kept OUT of app.uploads.dir on purpose: WebConfig serves that directory
# publicly at /uploads/**, and a voice note is private. These files are only ever
# reachable through ChatMediaController, which checks the signed link and the
# conversation membership first.
#
# On Azure App Service set this to an absolute path under /home (for example
# /home/data/chat-media). The default is relative to the working directory,
# which on App Service is /home/site/wwwroot - that is wiped on every deploy and
# is read-only when WEBSITE_RUN_FROM_PACKAGE=1.
app.chat.media.dir=chat-media
app.chat.media.max-bytes=26214400
app.chat.media.daily-quota-bytes=209715200

# Signs the short-lived chat media URLs. Defaults to the JWT secret so there is
# nothing extra to configure; set MEDIA_LINK_SECRET to rotate media links on their own.
app.media.link-secret=${MEDIA_LINK_SECRET:${app.jwt.secret}}

# ---- PayFast (wallet top-ups) ----
# Sandbox by default. PayFast's old shared demo merchant (10000100 / 46f0cd694581a)
# no longer validates against sandbox.payfast.co.za - confirmed by posting directly
# to /eng/process and getting "Generated signature does not match submitted
# signature" regardless of passphrase. These values are a real sandbox account
# registered at sandbox.payfast.co.za instead; no passphrase is set on it. Still not
# a secret - it is a test account with no real money behind it - but the real
# production ones go in App Settings on Azure and must never be committed.
app.payfast.sandbox=true
app.payfast.merchant-id=${PAYFAST_MERCHANT_ID:10054859}
app.payfast.merchant-key=${PAYFAST_MERCHANT_KEY:dku03dr7i156u}
app.payfast.passphrase=${PAYFAST_PASSPHRASE:}

# Where the student's browser lands afterwards. Neither of these credits anything:
# anyone can open a return URL without paying, so only the ITN moves money.
app.payfast.return-url=http://localhost:5173/wallet?topup=done
app.payfast.cancel-url=http://localhost:5173/wallet?topup=cancelled

# PayFast calls this server-to-server, so it MUST be reachable from the internet.
# On localhost it never will be. On Azure, set it to the deployed host:
# https://<your-app>.azurewebsites.net/api/payfast/itn
app.payfast.notify-url=http://localhost:8080/api/payfast/itn

# Local development with a cloudflared quick tunnel (the "Full Stack + PayFast
# tunnel" F5 profile). The tunnel's public URL changes every time it starts, so
# instead of pasting it into notify-url, point this at cloudflared's local metrics
# server and the URL is looked up on every top-up. Set it in your
# application-local.properties, never here - see the README, "Payments (PayFast)":
#   app.payfast.tunnel-discovery-url=http://127.0.0.1:20241/quicktunnel
app.payfast.tunnel-discovery-url=

# Checks the notification really came from PayFast's servers. Turn OFF only for
# local testing through a tunnel, where the peer address is the tunnel's and the
# check would always fail. Never disable it in a deployed environment.
app.payfast.validate-source-ip=true

# Local demo escape hatch for when you have no tunnel. PayFast can only confirm a
# payment by calling notify-url from their servers, which cannot reach localhost.
#
# Setting this to true adds POST /api/dev/payfast/complete/{m_payment_id}, which
# finishes YOUR OWN pending top-up as if PayFast had confirmed it, and the wallet
# page uses it instead of redirecting. It credits wallets, so it is gated by this
# property, @Profile("!prod"), and an ownership check. Leave it false unless you
# are demonstrating offline, and never set it in a deployed environment.
app.payfast.simulator.enabled=false

# ---- Wallet spend caps (rand) ----
# Per top-up, per transfer, and the most a student may top up (or send) in any
# rolling 24 hours. In-app limits only - PayFast account limits and Azure budget
# alerts are the external backstop.
app.wallet.max-topup=5000.00
app.wallet.max-transfer=5000.00
app.wallet.daily-limit=10000.00

# ---- Rate limiting (see security/RateLimitFilter) ----
# In-memory, per app instance. Switch off only in tests.
app.rate-limit.enabled=true

# ---- Escrow ----
# How long a seller's money may sit unconfirmed before it is released
# automatically. Without this a buyer who forgets to confirm freezes it forever.
app.escrow.auto-release-days=7

# ---- Trusted Seller badge ----
# Earned at 5 completed sales to 5 DIFFERENT buyers, each rated at least 4, and
# only while the overall average stays at or above the floor.
app.trust.badge.min-good-sales=5
app.trust.badge.min-rating=4
app.trust.badge.min-average=4.0

# ---- Behind a reverse proxy (Azure App Service, and any ingress that terminates TLS) ----
# Without this, ServletUriComponentsBuilder.fromCurrentContextPath() sees the
# internal HTTP request and builds http:// URLs for uploaded images. The frontend
# is served over HTTPS from Vercel, so the browser blocks those as mixed content
# and every uploaded image silently fails to load. Honours X-Forwarded-Proto.
server.forward-headers-strategy=framework