# Production overrides. Activated by SPRING_PROFILES_ACTIVE=prod (Azure App Settings).
#
# No secrets in this file - it is committed. Everything secret comes from the
# environment: JWT_SECRET, DB_*, MAIL_* (spring.mail.*), CORS_ALLOWED_ORIGINS,
# MEDIA_LINK_SECRET and PAYFAST_*.

# ---- Datasource (Azure Database for MySQL - Flexible Server) ----
# The base file's URL is hard-wired to localhost, so it can never reach Azure.
# DB_HOST has no default on purpose: forgetting it fails startup loudly instead
# of quietly trying localhost. Azure MySQL enforces TLS by default, hence sslMode.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:uniexchange}?sslMode=REQUIRED&serverTimezone=UTC

# ---- Files on disk ----
# App Service wipes /home/site/wwwroot (the working directory) on every deploy,
# and it is read-only under WEBSITE_RUN_FROM_PACKAGE=1. /home/data survives
# deploys and restarts. Listing images sit inside the uploads dir because
# WebConfig only serves that directory at /uploads/**.
app.uploads.dir=${UPLOADS_DIR:/home/data/uploads}
app.listing-images.upload-dir=${app.uploads.dir}/listing-images
app.chat.media.dir=${CHAT_MEDIA_DIR:/home/data/chat-media}

# ---- PayFast URLs ----
# The base file points these at localhost. No defaults here, so a deploy that
# forgets FRONTEND_URL / BACKEND_URL fails at startup rather than sending
# students back to localhost after paying. No trailing slash on either.
app.payfast.return-url=${FRONTEND_URL}/wallet?topup=done
app.payfast.cancel-url=${FRONTEND_URL}/wallet?topup=cancelled
app.payfast.notify-url=${BACKEND_URL}/api/payfast/itn
app.payfast.tunnel-discovery-url=
app.payfast.validate-source-ip=true

# ---- Schema ----
# Never let Hibernate alter a production schema. New tables/columns are created
# ahead of the deploy (see README, "Production schema"), and startup fails loudly
# if the entities and the database disagree.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ---- Error responses ----
# Spring's default /error body must never carry exception messages, stack traces
# or binding details to a client.
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never
spring.web.error.whitelabel.enabled=false

# ---- Payments ----
# The simulator credits wallets without PayFast. Never in production.
app.payfast.simulator.enabled=false

# ---- Logging ----
logging.level.root=INFO

# ---- Reverse proxy ----
# Azure App Service terminates TLS in front of the app. "native" lets Tomcat's
# RemoteIpValve apply X-Forwarded-For/-Proto, and it only honours them from
# internal proxy addresses, so a client cannot spoof its IP to dodge the rate limits.
server.forward-headers-strategy=native
