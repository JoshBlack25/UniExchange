<!--
  Source for public/icon-192.png, icon-512.png and apple-touch-icon.png.
  Full-bleed square (iOS and Android apply their own rounding/masks); the glyph
  sits inside the central 60% so a circular "maskable" crop never clips it.
  Same exchange glyph and brand gradient as src/components/layout/Logo.tsx.
  Rebuild with: npm run icons
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b9dc0"/>
      <stop offset="1" stop-color="#16658a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(12) translate(-12 -12)">
    <path d="M4 8h13l-3-3M20 16H7l3 3" fill="none" stroke="#ffffff" stroke-width="2.25"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
